[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "forge-switcheroo"
version = "0.1.0"
description = "Migrate a local Git repository between GitHub and GitLab safely."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "forge-switcheroo contributors" }]
dependencies = [
  "questionary>=2.1,<3",
  "rich>=13.9,<15",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
forge-switcheroo = "forge_switcheroo.cli:app"
fswitch = "forge_switcheroo.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/forge_switcheroo"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
source = ["forge_switcheroo"]

[tool.coverage.report]
fail_under = 60
show_missing = true
